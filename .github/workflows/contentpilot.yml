name: AR ContentPilot Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */4 * * *"

jobs:
  contentpilot-automation:
    name: Run ContentPilot Automation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ContentPilot automation
        run: node scripts/contentpilot-automation.js